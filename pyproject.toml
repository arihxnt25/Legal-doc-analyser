[project]
name = "contractlens"
version = "1.0.0"
description = "NLP clause extraction, risk review and search for legal contracts, trained on CUAD"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 125
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B905", "B008"]  # B008: FastAPI File()/Query() defaults are idiomatic

[tool.ruff.lint.isort]
known-first-party = ["contractlens", "api"]
